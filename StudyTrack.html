<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyTrack - Student Task Manager</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #root { min-width: 320px; min-height: 100%; }
    body {
      margin: 0; min-height: 100vh; font-family: Arial, sans-serif;
      background: #f4f6fb; color: #20243a;
    }
    button, input { font: inherit; }
    .header {
      background: #fff; padding: 20px 8%; display: flex;
      justify-content: space-between; align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }
    .logo { font-size: 23px; font-weight: bold; color: #635bdb; }
    .header span { color: #666b7a; font-size: 14px; }
    .container { width: min(900px, 92%); margin: 35px auto; }
    .welcome { background: #635bdb; color: white; padding: 30px; border-radius: 16px; }
    .tag { font-size: 12px; letter-spacing: 2px; font-weight: bold; }
    .welcome h1 { font-size: 30px; margin: 12px 0; }
    .welcome p:last-child { line-height: 1.6; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 22px 0; }
    .stat-card, .task-panel {
      background: white; padding: 22px; border-radius: 12px;
      box-shadow: 0 3px 15px #20243a0b;
    }
    .stat-card span { color: #777b89; font-size: 14px; }
    .stat-card h2 { font-size: 28px; margin: 10px 0 0; color: #635bdb; }
    .task-panel h2 { margin-top: 0; }
    .task-form { display: flex; gap: 10px; }
    .task-form input {
      flex: 1; min-width: 0; padding: 13px; border: 1px solid #d9dce7;
      border-radius: 8px; outline-color: #635bdb;
    }
    .task-form button {
      background: #635bdb; color: white; border: none;
      border-radius: 8px; padding: 12px 18px; cursor: pointer;
    }
    .filters { display: flex; gap: 10px; margin: 22px 0; }
    .filters button {
      background: #f0efff; color: #635bdb; border: none;
      padding: 9px 15px; border-radius: 20px; cursor: pointer;
    }
    .filters button.active { background: #635bdb; color: white; }
    .task-list { display: grid; gap: 10px; }
    .task-item {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; padding: 14px; border: 1px solid #ececf2; border-radius: 8px;
    }
    .task-label { display: flex; align-items: center; gap: 10px; overflow-wrap: anywhere; }
    .task-label input { accent-color: #635bdb; }
    .done { text-decoration: line-through; color: #9295a1; }
    .delete-btn {
      background: #fff0f0; color: #d63e48; border: none;
      padding: 8px 12px; border-radius: 6px; cursor: pointer;
    }
    .empty { text-align: center; color: #777b89; padding: 25px 5px; }
    footer { text-align: center; padding: 25px 0; color: #777b89; font-size: 13px; }
    @media (max-width: 600px) {
      .header { padding: 16px 4%; gap: 10px; }
      .header span { font-size: 12px; }
      .container { margin: 20px auto; }
      .welcome { padding: 22px; }
      .welcome h1 { font-size: 24px; }
      .stats { gap: 8px; }
      .stat-card { padding: 12px 8px; }
      .stat-card span { font-size: 12px; }
      .stat-card h2 { font-size: 23px; }
      .task-panel { padding: 16px; }
      .task-form { flex-direction: column; }
      .task-form button { padding: 12px; }
      .filters { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React libraries load from the internet, so an internet connection is needed. -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useEffect, useState } = React;

    function App() {
      const [tasks, setTasks] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem("studentTasks")) || [];
        } catch {
          return [];
        }
      });
      const [taskName, setTaskName] = useState("");
      const [filter, setFilter] = useState("All");

      useEffect(() => {
        localStorage.setItem("studentTasks", JSON.stringify(tasks));
      }, [tasks]);

      function addTask(e) {
        e.preventDefault();
        if (taskName.trim() === "") return;

        const newTask = {
          id: Date.now(),
          title: taskName.trim(),
          completed: false
        };
        setTasks([...tasks, newTask]);
        setTaskName("");
      }

      function toggleTask(id) {
        setTasks(tasks.map(task =>
          task.id === id ? { ...task, completed: !task.completed } : task
        ));
      }

      function deleteTask(id) {
        setTasks(tasks.filter(task => task.id !== id));
      }

      const completedCount = tasks.filter(task => task.completed).length;
      const pendingCount = tasks.length - completedCount;
      const filteredTasks = tasks.filter(task => {
        if (filter === "Pending") return !task.completed;
        if (filter === "Completed") return task.completed;
        return true;
      });

      return (
        <div className="app">
          <header className="header">
            <div className="logo">StudyTrack</div>
            <span>Student Task Manager</span>
          </header>

          <main className="container">
            <section className="welcome">
              <p className="tag">YOUR STUDY PLANNER</p>
              <h1>Plan your day, achieve more!</h1>
              <p>Organize your assignments and stay productive.</p>
            </section>

            <section className="stats">
              <div className="stat-card"><span>Total Tasks</span><h2>{tasks.length}</h2></div>
              <div className="stat-card"><span>Pending</span><h2>{pendingCount}</h2></div>
              <div className="stat-card"><span>Completed</span><h2>{completedCount}</h2></div>
            </section>

            <section className="task-panel">
              <h2>My Tasks</h2>
              <form className="task-form" onSubmit={addTask}>
                <input
                  type="text"
                  placeholder="Enter a task..."
                  value={taskName}
                  onChange={e => setTaskName(e.target.value)}
                />
                <button type="submit">+ Add Task</button>
              </form>

              <div className="filters">
                {["All", "Pending", "Completed"].map(item => (
                  <button
                    key={item}
                    type="button"
                    className={filter === item ? "active" : ""}
                    onClick={() => setFilter(item)}
                  >
                    {item}
                  </button>
                ))}
              </div>

              <div className="task-list">
                {filteredTasks.length === 0 ? (
                  <p className="empty">No tasks here. Add a task to get started!</p>
                ) : (
                  filteredTasks.map(task => (
                    <div className="task-item" key={task.id}>
                      <label className="task-label">
                        <input
                          type="checkbox"
                          checked={task.completed}
                          onChange={() => toggleTask(task.id)}
                        />
                        <span className={task.completed ? "done" : ""}>{task.title}</span>
                      </label>
                      <button
                        className="delete-btn"
                        type="button"
                        onClick={() => deleteTask(task.id)}
                        aria-label={"Delete " + task.title}
                      >
                        Delete
                      </button>
                    </div>
                  ))
                )}
              </div>
            </section>

            <footer>Student Task Manager | Built with React.js</footer>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
